<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DBG-053 改訂案3・未承認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d14;color:#f4efe6;font:16px/1.5 system-ui,sans-serif}button,a,summary{touch-action:manipulation}button{font:600 14px/1.4 system-ui;color:inherit;min-height:44px;min-width:44px;border:1px solid #9c815a;border-radius:4px;background:#30252c;padding:6px 10px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #ffdf97;outline-offset:2px}.tools{max-width:940px;margin:auto;padding:12px;text-align:center}.tools h1{font-size:20px;margin:0}.tools p{font-size:14px;margin:6px}.tools a{color:#efd28c;display:inline-flex;align-items:center;min-height:44px;padding:4px 8px}.tools details{text-align:left;font-size:14px}.tools summary{min-height:44px;cursor:pointer}.screen{width:375px;max-width:100%;height:664px;display:grid;place-items:center;margin:auto;padding:12px}.panel{width:100%;display:flex;flex-direction:column;max-height:531px;border:1px solid #a78b59;border-radius:4px;background:#19141c;overflow:hidden}.heading{display:flex;justify-content:center;padding:4px 12px;flex:none}.heading img{width:216px;height:36px;object-fit:contain}.tabs{display:flex;padding:0 12px;flex:none}.tabs button{flex:1;border:0;border-bottom:1px solid #655039;border-radius:0;background:none;padding:6px 4px}.tabs button[aria-selected=true]{color:#f1d28c;border-bottom:2px solid #f1d28c}.tabs small{font-size:13px}.body{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#a78b59 #19141c;min-height:0;padding:0 12px}.row{padding:8px 0;border-bottom:1px solid #655039;display:grid;gap:2px}.row h3{margin:0;font-size:16px;line-height:24px;font-weight:600;overflow-wrap:anywhere}.progress{display:flex;align-items:center;gap:8px;min-height:20px;font-size:13px;line-height:20px;font-variant-numeric:tabular-nums}.track{height:6px;flex:1;min-width:36px;background:#473b43;border-radius:6px;overflow:hidden}.fill{height:100%;background:#dfbb73}.progress span{white-space:nowrap}.progress .remaining{color:#d6c6ad}.progress .achieved{color:#dfd294}.bottom{display:flex;align-items:center;gap:8px;justify-content:space-between}.rewards{display:flex;align-items:center;gap:4px;min-width:0;flex-wrap:wrap}.reward{display:flex;align-items:center;gap:3px;background:none;border:0;padding:0 3px;font-size:13px;white-space:nowrap}.reward img{width:24px;height:24px;object-fit:contain}.more{padding:4px;border:0;background:none;color:#efd28c;font-size:13px}.action{width:56px;flex:none;padding:6px}.claim{background:#8d3024;border-color:#cd8b69}.check{width:56px;flex:none;min-height:44px;display:grid;place-items:center;font-size:19px;color:#bdd8ad}.claimed summary{font-size:14px;min-height:44px;display:flex;align-items:center;cursor:pointer;color:#bdd8ad}.claimed summary:before{content:'▸';margin-right:8px}.claimed[open] summary:before{content:'▾'}.footer{display:flex;gap:8px;padding:6px 12px;flex:none;border-top:1px solid #655039}.footer .bulk{flex:1;background:#8d3024}.footer .close{width:64px}.status{font-size:13px;margin:8px 0;color:#bdd8ad}.status:empty{display:none}.empty{font-size:14px;color:#cdbfba}dialog{width:calc(100% - 32px);max-width:351px;max-height:80dvh;overflow:auto;border:1px solid #a78b59;border-radius:4px;background:#211b24;color:#f4efe6;padding:12px}dialog::backdrop{background:#000b}dialog h2{font-size:18px;margin:0 0 8px}dialog p{font-size:14px}dialog ul{list-style:none;padding:0;margin:0}dialog li{display:flex;align-items:center;gap:8px;border-bottom:1px solid #655039;padding:8px 0;font-size:14px}dialog img{width:32px;height:32px;object-fit:contain}dialog footer{text-align:right;margin-top:8px}body.capture .tools{display:none}body.capture .screen{width:100vw!important;height:100dvh;margin:0}body.capture .panel{max-height:80dvh}

<header class="tools"><h1>DBG-053 改訂案3・未承認</h1><p>正式任務から抜粋。進捗と受取はローカル見本です。実報酬の付与・画面遷移は行いません。</p><nav id="scenarios"></nav><nav><a id="w375">375px</a><a id="w390">390px</a><button id="reset">見本を戻す</button></nav><details><summary>見本の所持品・参照元</summary><p>formalMissions.ts / formalMissions.json。名称・報酬は正式データ。表示上の受取状態はこの見本内のみ。</p><div id="inventory">受取前</div></details></header>
<main class="screen"><section class="panel" role="dialog" aria-label="任務 改訂案3"><header class="heading"><img src="__BANNER__" alt="任務"></header><nav class="tabs" role="tablist" aria-label="任務分類"></nav><div class="body"><p class="status" role="status" aria-live="polite"></p><div id="rows"></div></div><footer class="footer"><button class="bulk">一括受取</button><button class="close">閉じる</button></footer></section></main><dialog id="detail"><h2></h2><div class="detail-body"></div><footer><button>戻る</button></footer></dialog>
<script>
const masters=__ROWS__,params=new URLSearchParams(location.search),scenario=params.get('state')||'progress',width=params.get('width')==='390'?390:375;
const scenarios={zero:'未着手0/3',progress:'進行中1/3',achieved:'達成3/3',claimed:'受取済み',rewards:'複数報酬',bulk:'一括受取3件'};
document.querySelector('.screen').style.width=width+'px';if(params.has('capture'))document.body.classList.add('capture');document.getElementById('scenarios').innerHTML=Object.entries(scenarios).map(([s,t])=>'<a href="?state='+s+'&width='+width+'">'+t+'</a>').join('');for(const w of [375,390])document.getElementById('w'+w).href='?state='+scenario+'&width='+w;
let tab='daily',busy=false,items=[],inventory={},claimedOpen=false;const body=document.querySelector('.body'),status=document.querySelector('.status'),detail=document.querySelector('#detail');
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function reset(){if(busy)return;inventory={};claimedOpen=false;tab='daily';const counters={battle:scenario==='zero'?0:scenario==='progress'?1:3,quest_clear:scenario==='zero'?0:scenario==='progress'?1:3,normal_gacha:scenario==='bulk'?1:0,growth:0};items=masters.map(m=>({...m,current:m.tab==='normal'?(scenario==='bulk'&&m.id==='NM001'?1:0):Math.min(counters[m.condition.key]||0,m.target),claimed:scenario==='claimed'&&m.tab==='daily'}));if(scenario==='claimed')items.forEach(m=>{if(m.claimed)m.current=m.target});status.textContent='';render();body.scrollTop=0;}
function canClaim(m){return !m.claimed&&m.current>=m.target}
function renderRow(m){const achieved=m.current>=m.target;return '<section class="row" data-id="'+m.id+'"><h3>'+escape(m.title)+'</h3><div class="progress"><div class="track" role="progressbar" aria-label="'+escape(m.title)+'" aria-valuemin="0" aria-valuemax="'+m.target+'" aria-valuenow="'+m.current+'"><div class="fill" style="width:'+Math.min(100,m.current/m.target*100)+'%"></div></div><span>'+m.current+' / '+m.target+m.unit+'</span>'+(achieved?(m.claimed?'':'<span class="achieved">達成</span>'):'<span class="remaining">あと'+(m.target-m.current)+m.unit+'</span>')+'</div><div class="bottom"><div class="rewards">'+m.rewards.slice(0,2).map((r,i)=>'<button class="reward" data-reward="'+m.id+':'+i+'" aria-label="'+escape(r.label)+'の詳細"><img src="'+r.image+'" alt=""><span>×'+r.amount.toLocaleString()+'</span></button>').join('')+(m.rewards.length>2?'<button class="more" data-all="'+m.id+'" aria-label="全'+m.rewards.length+'件の報酬を確認">＋'+(m.rewards.length-2)+'件</button>':'')+'</div>'+(m.claimed?'<span class="check" role="img" aria-label="受取済み">✓</span>':'<button class="action '+(achieved?'claim':'')+'" data-action="'+m.id+'" '+(busy?'disabled':'')+'>'+(achieved?'受取':'挑戦')+'</button>')+'</div></section>'}
function render(){const visible=items.filter(m=>m.tab===tab),unclaimed=visible.filter(m=>!m.claimed).sort((a,b)=>Number(canClaim(b))-Number(canClaim(a))),claimed=visible.filter(m=>m.claimed);document.querySelector('.tabs').innerHTML=['daily','normal'].map(t=>'<button role="tab" aria-selected="'+(t===tab)+'" data-tab="'+t+'" '+(busy?'disabled':'')+'>'+(t==='daily'?'デイリー':'ノーマル')+' <small>('+items.filter(m=>m.tab===t&&canClaim(m)).length+')</small></button>').join('');document.getElementById('rows').innerHTML=unclaimed.map(renderRow).join('')+(!unclaimed.length?'<p class="empty">未受取の任務はありません</p>':'')+(claimed.length?'<details class="claimed" '+(claimedOpen?'open':'')+'><summary>受取済み（'+claimed.length+'件）</summary>'+claimed.map(renderRow).join('')+'</details>':'');const bulk=document.querySelector('.bulk'),count=visible.filter(canClaim).length;bulk.textContent=busy?'受取中…':'一括受取（'+count+'件）';bulk.disabled=busy||!count;document.querySelector('.close').disabled=busy;document.querySelector('.panel').setAttribute('aria-busy',String(busy));document.getElementById('inventory').textContent=Object.values(inventory).map(r=>r.label.replace(/ ×[\d,]+$/,'')+' ×'+r.amount.toLocaleString()).join('、')||'受取前';const details=document.querySelector('.claimed');if(details)details.addEventListener('toggle',()=>{claimedOpen=details.open});}
function showDetail(title,html){detail.querySelector('h2').textContent=title;detail.querySelector('.detail-body').innerHTML=html;detail.showModal()}
function rewardsDetail(m,index){const rewards=index===undefined?m.rewards:[m.rewards[index]];showDetail(m.title+'：報酬','<ul>'+rewards.map(r=>'<li><img src="'+r.image+'" alt=""><span>'+escape(r.label)+'</span></li>').join('')+'</ul><p>正式マスターの報酬です。</p>')}
async function claim(ids){if(busy)return;const selected=items.filter(m=>m.tab===tab&&ids.includes(m.id)&&canClaim(m));if(!selected.length)return;busy=true;render();await new Promise(r=>setTimeout(r,650));let count=0;for(const m of selected){if(!canClaim(m))continue;for(const r of m.rewards){const key=r.kind+':'+(r.id||'');inventory[key]||={...r,amount:0};inventory[key].amount+=r.amount;}m.claimed=true;count++;}busy=false;claimedOpen=false;status.textContent=count+'件を受け取りました（見本）';render();body.scrollTop=0;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab&&!busy){tab=b.dataset.tab;claimedOpen=false;status.textContent='';render();body.scrollTop=0;}else if(b.dataset.reward){const [id,i]=b.dataset.reward.split(':');rewardsDetail(items.find(m=>m.id===id),Number(i));}else if(b.dataset.all)rewardsDetail(items.find(m=>m.id===b.dataset.all));else if(b.dataset.action){const m=items.find(m=>m.id===b.dataset.action);if(canClaim(m))claim([m.id]);else showDetail('挑戦先の確認','<p>'+escape(m.name)+'</p><p>実装時は正式条件に対応する画面へ移動します。この見本では移動しません。</p>');}});
document.querySelector('.bulk').onclick=()=>claim(items.filter(m=>m.tab===tab&&canClaim(m)).map(m=>m.id));detail.querySelector('button').onclick=()=>detail.close();document.querySelector('.close').onclick=()=>showDetail('表示見本','<p>実画面では任務を閉じます。この見本は表示を保持します。</p>');document.getElementById('reset').onclick=reset;reset();
</script></html>
