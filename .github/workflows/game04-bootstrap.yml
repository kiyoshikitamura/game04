name: GAME04 production snapshot import
on:
  push:
    branches: [codex/game04-production-clone]
    paths: [.github/workflows/game04-bootstrap.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore approved snapshot and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir=$(mktemp -d)
          overlay_dir=$(mktemp -d)
          cp -a .clone-overlay/. "$overlay_dir/"
          curl --fail --location --retry 3 https://codeload.github.com/kiyoshikitamura/tribe-neon/tar.gz/e2998ff0ecbc2d8e608f3e47f9f43ed0fd6f723c | tar -xz --strip-components=1 -C "$snapshot_dir"
          rsync -a --delete --exclude=.git/ "$snapshot_dir/" ./
          rm -f .github/workflows/quality.yml
          cp -a "$overlay_dir/." ./
          git add -f -A
          echo "assembled-tree=$(git write-tree)"
          test "$(git write-tree)" = f4c8674c8b78f7176510dcf47137cb04fb428691
          git -c user.name='GAME04 Import' -c user.email='game04-import@users.noreply.github.com' commit -m 'Import verified GAME03 production snapshot with Sengoku assets'
          git push origin HEAD:codex/game04-production-clone
